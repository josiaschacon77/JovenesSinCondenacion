<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJSC - Enlaces Oficiales</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* FONDO DESENFOCADO */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("img/IGLE.png") center/cover no-repeat;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: -1;
        }

        /* Oscurecer un poco para mejor contraste */
        .background::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            top: 0;
            left: 0;
        }

        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 1rem;
            margin: 20px 0 15px;
            color: #f0f0f0;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .fb { background-color: #1877F2; }
        .tiktok { background-color: #000000; border: 1px solid #ff0050; }
        .prayer { background-color: #28a745; }

        @media (max-width: 480px) {
            h1 { font-size: 1.2rem; }
            .container { padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <h1>Bienvenidos</h1>

        <div class="section-title">Nuestras Redes Sociales</div>

        <a href="https://www.facebook.com/M.C.C.Renacimiento" class="btn fb">Facebook Iglesia MCCR</a>
        <a href="https://www.facebook.com/share/18pdwNyKk8/" class="btn fb">Facebook Jovenes sin Condenacion</a>
        <a href="https://www.tiktok.com/@jovenes.sin.conde?_r=1&_t=ZS-967vdYFXnMK" class="btn tiktok">TikTok Oficial</a>

        <div class="section-title">Petición de Oración</div>

        <a href="https://forms.cloud.microsoft/r/BuAJrNkhzt?origin=lprLink" class="btn prayer">Enviar mi Petición</a>
    </div>

</body>
</html>
